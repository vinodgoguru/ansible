- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform
    tagMap:
      name: ansible
      project: roboshop
      environment: dev
    full_name: Goguru Vinod Kumar
    ip_address: 12.34.56.78
    tagList: [
        {
            "key": "name",
            "value": "ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "environment",
            "value": "dev"
        }
    ]

  tasks:
  - name: convert string to list
    debug:
      msg: "Topics are : {{ topics | split(',')}}"

  - name: set default common_value
    debug:
      msg: "Hi {{ GREETING | default('Good Morning') }}"

  - name: convert map to list
    debug:
      msg: "{{ tagMap | dict2items }}"

  - name: convert list to map
    debug:
      msg: "{{ tagList | items2dict }}"

  - name: convert to uppercase
    debug:
      msg: "{{ full_name | upper }}"

  - name: convert to lowercase
    debug:
      msg: "{{ full_name | lower }}"

  - name: check ip address 
    debug:
      msg: "{{ ip_address | ansible.utils.ipv4 }}"

